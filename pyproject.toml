[project]
name = "pracht_module"
authors = [{ name = "Pracht", email = "ai@autmation.org" }]
description = "Registriert die Module Vermietung und Fuhrpark im Dateisystem"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
